<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title id="pageTitle">Comprar Código Para Headless</title>
    <style>
        /* ============================================================
           RESET & BASE - ESTILO ROBLOX OFICIAL
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --roblox-black: #0b0b0e;
            --roblox-dark: #1a1a1f;
            --roblox-card: #212127;
            --roblox-card-hover: #2a2a30;
            --roblox-border: #2d2d35;
            --roblox-text: #ffffff;
            --roblox-text-secondary: #b0b0c0;
            --roblox-text-muted: #7a7a8a;
            --roblox-blue: #0066ff;
            --roblox-blue-hover: #1a7aff;
            --roblox-green: #00b06f;
            --roblox-green-hover: #00cc7e;
            --roblox-red: #ff4757;
            --roblox-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            --roblox-radius: 8px;
            --transition: 0.2s ease;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--roblox-black);
            color: var(--roblox-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            padding: 0 12px;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: var(--roblox-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--roblox-border);
            border-radius: 12px;
        }

        /* ===== NAVBAR ROBLOX - MOBILE FIRST ===== */
        .navbar {
            width: 100%;
            max-width: 1200px;
            background: var(--roblox-dark);
            border-bottom: 1px solid var(--roblox-border);
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 48px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 0 rgba(255,255,255,0.03);
            flex-wrap: wrap;
            gap: 6px;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--roblox-text);
            letter-spacing: -0.3px;
            text-decoration: none;
        }

        .nav-logo img {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            object-fit: cover;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 2px;
            list-style: none;
        }

        .nav-item {
            padding: 4px 8px;
            border-radius: var(--roblox-radius);
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--roblox-text-secondary);
            cursor: default;
            transition: var(--transition);
        }

        .nav-item.active {
            color: var(--roblox-text);
            background: rgba(255,255,255,0.06);
        }

        .nav-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1 1 100%;
            order: 3;
            padding: 4px 0 2px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: #2a2a32;
            border: 1px solid var(--roblox-border);
            border-radius: 20px;
            padding: 0 12px;
            height: 36px;
            max-width: 100%;
            width: 100%;
            transition: var(--transition);
        }

        .search-bar:focus-within {
            border-color: var(--roblox-blue);
        }

        .search-icon {
            width: 14px;
            height: 14px;
            stroke: var(--roblox-text-muted);
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--roblox-text);
            font-size: 16px;
            /* Impede zoom no iOS */
            font-family: inherit;
            width: 100%;
            padding: 0 6px;
        }

        .search-input::placeholder {
            color: var(--roblox-text-muted);
            font-size: 0.85rem;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .currency-display {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.04);
            padding: 2px 8px 2px 6px;
            border-radius: 20px;
            border: 1px solid var(--roblox-border);
            transition: var(--transition);
        }

        .currency-display:hover {
            border-color: var(--roblox-text-muted);
        }

        .currency-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .currency-amount {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--roblox-text);
        }

        /* ===== MODE TOGGLE ===== */
        .mode-toggle {
            width: 100%;
            max-width: 540px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 12px 0 4px;
            flex-wrap: wrap;
        }

        .mode-toggle span {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--roblox-text-secondary);
        }

        .mode-toggle button {
            background: var(--roblox-card);
            border: 1px solid var(--roblox-border);
            color: var(--roblox-text-secondary);
            padding: 6px 16px;
            min-height: 36px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
        }

        .mode-toggle button:hover {
            background: var(--roblox-card-hover);
            border-color: var(--roblox-text-muted);
            color: var(--roblox-text);
        }

        .mode-toggle button:active {
            transform: scale(0.95);
        }

        /* ===== CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 540px;
            padding: 12px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ===== HEADLESS IMAGE ===== */
        .headless-image {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 2px 0;
        }

        .headless-image img {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
            border-radius: 4px;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--roblox-text);
            padding: 0 4px;
        }

        .header p {
            color: var(--roblox-text-secondary);
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .header a {
            color: var(--roblox-blue);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .header a:hover {
            color: var(--roblox-blue-hover);
            text-decoration: underline;
        }

        /* ===== COST INFO ===== */
        .cost-info {
            text-align: center;
            color: var(--roblox-text-secondary);
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            margin-top: -2px;
        }

        .cost-info span {
            color: var(--roblox-text);
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.9rem;
        }

        .cost-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        /* ===== GIFT WRAPPER ===== */
        .gift-wrapper {
            background: var(--roblox-card);
            border: 1px solid var(--roblox-border);
            border-radius: var(--roblox-radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: var(--roblox-shadow);
        }

        .gift-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--roblox-text-secondary);
            text-align: center;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .gift-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box {
            position: relative;
        }

        .search-row {
            display: flex;
            gap: 6px;
        }

        .search-row input {
            flex: 1;
            background: #2a2a32;
            border: 1px solid var(--roblox-border);
            color: var(--roblox-text);
            font-family: inherit;
            font-size: 16px;
            /* Impede zoom no iOS */
            padding: 10px 12px;
            min-height: 48px;
            border-radius: var(--roblox-radius);
            outline: none;
            transition: var(--transition);
        }

        .search-row input::placeholder {
            color: var(--roblox-text-muted);
            font-size: 0.85rem;
        }

        .search-row input:focus {
            border-color: var(--roblox-blue);
        }

        .suggestions {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--roblox-card);
            border: 1px solid var(--roblox-border);
            border-radius: var(--roblox-radius);
            overflow: hidden;
            display: none;
            z-index: 10;
            box-shadow: var(--roblox-shadow);
            max-height: 180px;
            overflow-y: auto;
        }

        .suggestions.show {
            display: block;
        }

        .suggestion-item {
            padding: 10px 12px;
            font-size: 0.85rem;
            color: var(--roblox-text);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 44px;
        }

        .suggestion-item:hover {
            background: var(--roblox-card-hover);
        }

        .suggestion-item .badge {
            font-size: 0.6rem;
            color: var(--roblox-text-muted);
            background: var(--roblox-dark);
            padding: 2px 8px;
            border-radius: 12px;
        }

        .gift-status {
            font-size: 0.8rem;
            color: var(--roblox-text-secondary);
            padding: 4px 0;
            display: none;
            animation: fadeIn 0.2s ease;
        }

        .gift-status.show {
            display: block;
        }

        .gift-status.err {
            color: var(--roblox-red);
        }

        .gift-status .loader-dots::after {
            content: '...';
            animation: dots 1.2s steps(4) infinite;
        }

        @keyframes dots {
            0% {
                content: '';
            }
            25% {
                content: '.';
            }
            50% {
                content: '..';
            }
            75% {
                content: '...';
            }
        }

        .gift-status .loader-dots {
            display: inline-block;
            min-width: 20px;
        }

        /* ===== PLAYER CARD - MAIOR E TOUCH FRIENDLY ===== */
        .player-card {
            display: flex;
            gap: 14px;
            align-items: center;
            background: #2a2a32;
            border-radius: var(--roblox-radius);
            padding: 12px 14px;
            display: none;
            border: 1px solid var(--roblox-border);
            animation: fadeIn 0.25s ease;
        }

        .player-card.show {
            display: flex;
        }

        .player-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--roblox-radius);
            overflow: hidden;
            background: var(--roblox-black);
            flex-shrink: 0;
            border: 1px solid var(--roblox-border);
        }

        .player-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .player-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--roblox-text);
        }

        .player-username {
            font-size: 0.8rem;
            color: var(--roblox-text-muted);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .action-buttons button {
            flex: 1;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            border-radius: var(--roblox-radius);
            padding: 10px 0;
            min-height: 44px;
            cursor: pointer;
            transition: var(--transition);
            touch-action: manipulation;
        }

        .btn-confirm {
            background: var(--roblox-blue);
            color: #fff;
        }

        .btn-confirm:hover {
            background: var(--roblox-blue-hover);
        }

        .btn-donate {
            background: var(--roblox-green);
            color: #fff;
        }

        .btn-donate:hover {
            background: var(--roblox-green-hover);
        }

        .action-buttons button:active {
            transform: scale(0.96);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== NUMBER DISPLAY ===== */
        .number-display {
            background: var(--roblox-dark);
            border: 1px solid var(--roblox-border);
            border-radius: var(--roblox-radius);
            padding: 16px 12px;
            text-align: center;
            transition: var(--transition);
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .number-display.highlight {
            border-color: var(--roblox-blue);
            box-shadow: 0 0 20px rgba(0, 102, 255, 0.15);
        }

        .number-text {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-family: 'Inter', monospace;
            color: var(--roblox-text);
            user-select: all;
            line-height: 1.2;
        }

        .number-text.placeholder {
            color: var(--roblox-text-muted);
            font-size: 0.9rem;
            letter-spacing: 0.5px;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }

        /* ===== CODE STATUS ===== */
        .code-status-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: -2px;
        }

        .current-code-status {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
        }

        .current-code-status.show {
            display: block;
        }

        .current-code-status.available {
            color: var(--roblox-green);
        }

        .current-code-status.redeemed {
            color: var(--roblox-red);
        }

        .timer-bar {
            width: 100%;
            height: 3px;
            background: var(--roblox-border);
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }

        .timer-bar.show {
            display: block;
        }

        .timer-bar .fill {
            height: 100%;
            width: 100%;
            background: var(--roblox-blue);
            border-radius: 4px;
            transition: width 0.3s linear;
        }

        /* ===== BUTTON GROUP - MOBILE STACK ===== */
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
            flex-direction: column;
        }

        .btn {
            flex: 1;
            padding: 14px 16px;
            min-height: 50px;
            border-radius: var(--roblox-radius);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            color: #fff;
            letter-spacing: -0.2px;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.96);
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .btn-generate {
            background: var(--roblox-blue);
            flex: 1;
            box-shadow: 0 4px 12px rgba(0, 102, 255, 0.2);
        }

        .btn-generate:hover:not(:disabled) {
            background: var(--roblox-blue-hover);
            box-shadow: 0 6px 20px rgba(0, 102, 255, 0.3);
        }

        .btn-copy {
            background: var(--roblox-card);
            border: 1px solid var(--roblox-border);
            color: var(--roblox-text-secondary);
            flex: 1;
        }

        .btn-copy:hover:not(:disabled) {
            background: var(--roblox-card-hover);
            border-color: var(--roblox-text-muted);
            color: var(--roblox-text);
        }

        .btn-copy.copied {
            background: rgba(0, 176, 111, 0.15);
            border-color: var(--roblox-green);
            color: var(--roblox-green);
        }

        .btn-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--roblox-dark);
            color: var(--roblox-text);
            padding: 10px 18px;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.8rem;
            box-shadow: var(--roblox-shadow);
            border: 1px solid var(--roblox-border);
            z-index: 1000;
            transition: transform 0.4s ease, opacity 0.3s ease;
            pointer-events: none;
            opacity: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            max-width: 90%;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-color: var(--roblox-green);
        }

        .toast.error {
            border-color: var(--roblox-red);
        }

        .toast .toast-icon {
            font-size: 1rem;
        }

        /* ===== TOP NOTIFICATION ===== */
        .top-notification {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: var(--roblox-green);
            color: #fff;
            text-align: center;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            z-index: 1200;
            transform: translateY(-100%);
            transition: transform 0.4s ease;
            box-shadow: 0 4px 12px rgba(0, 176, 111, 0.3);
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .top-notification .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .top-notification.show {
            transform: translateY(0);
        }

        /* ===== MODAL - MOBILE FULL WIDTH ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: flex-end;
            /* Alinha embaixo para mobile */
            justify-content: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 0;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--roblox-card);
            width: 100%;
            max-width: 100%;
            max-height: 85vh;
            border-radius: var(--roblox-radius) var(--roblox-radius) 0 0;
            padding: 20px 16px 24px;
            position: relative;
            color: var(--roblox-text);
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--roblox-border);
            border-bottom: none;
            transform: translateY(20px);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            overflow-y: auto;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
            opacity: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--roblox-border);
        }

        .modal-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--roblox-text);
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--roblox-text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
            line-height: 1;
            padding: 4px 8px;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            color: var(--roblox-text);
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: 100%;
            margin-bottom: 14px;
        }

        .modal-item-preview {
            background: var(--roblox-dark);
            border-radius: var(--roblox-radius);
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border: 1px solid var(--roblox-border);
        }

        .modal-item-preview img {
            width: 54px;
            height: 54px;
            object-fit: contain;
        }

        .modal-item-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            text-align: center;
        }

        .modal-item-name {
            font-weight: 600;
            color: var(--roblox-text);
            font-size: 0.95rem;
        }

        .modal-item-sub {
            font-size: 0.8rem;
            color: var(--roblox-text-muted);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 4px;
            flex-direction: column;
        }

        .btn-modal {
            flex: 1;
            padding: 14px 14px;
            min-height: 48px;
            border-radius: var(--roblox-radius);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: var(--transition);
            touch-action: manipulation;
        }

        .btn-modal:active {
            transform: scale(0.96);
        }

        .btn-buy {
            background: var(--roblox-blue);
            color: #fff;
        }

</head>

    <script>
        (function() {
            'use strict';

            // ===== MODES =====
            const MODES = {
                headless: {
                    name: 'Headless Horseman',
                    image: 'https://tr.rbxcdn.com/30DAY-Avatar-45C487EE82855E78448B101B117F13C6-Png/420/420/Avatar/Png/noFilter',
                    title: 'Comprar Código Para Headless',
                    cost: 31000
                },
                korblox: {
                    name: 'Korblox DeathSpeaker',
                    image: 'https://tr.rbxcdn.com/30DAY-Avatar-474591209C9CA45D9005D90A790EED4F-Png/420/420/Avatar/Webp/noFilter',
                    title: 'Comprar Código Para Korblox DeathSpeaker',
                    cost: 17000
                }
            };

            let currentMode = 'headless';

            // ===== DOM REFS =====
            const $ = (id) => document.getElementById(id);
            const mainImage = $('mainImage');
            const mainTitle = $('mainTitle');
            const pageTitle = $('pageTitle');
            const currentModeLabel = $('currentModeLabel');
            const toggleBtn = $('toggleModeBtn');
            const costValue = $('costValue');
            const btnGenerate = $('btnGenerate');
            const balanceDisplay = $('balanceDisplay');
            const numberText = $('numberText');
            const numberDisplay = $('numberDisplay');
            const btnCopy = $('btnCopy');
            const currentCodeStatus = $('currentCodeStatus');
            const timerBar = $('timerBar');
            const timerFill = $('timerFill');
            const modalOverlay = $('modalOverlay');
            const modalTitle = $('modalTitle');
            const modalBody = $('modalBody');
            const modalBalanceInfo = $('modalBalanceInfo');
            const btnModalCancel = $('btnModalCancel');
            const btnModalConfirm = $('btnModalConfirm');
            const modalClose = $('modalClose');
            const toast = $('toast');
            const toastMessage = $('toastMessage');
            const topNotification = $('topNotification');
            const notificationText = $('notificationText');
            const notificationSpinner = $('notificationSpinner');

            // Gift/Donate
            const giftInput = $('giftUsernameInput');
            const giftSuggestions = $('giftSuggestions');
            const giftStatus = $('giftStatus');
            const giftPlayerCard = $('giftPlayerCard');
            const giftAvatarImg = $('giftAvatarImg');
            const giftDisplayName = $('giftDisplayName');
            const giftUsername = $('giftUsername');
            const confirmPlayerBtn = $('confirmPlayerBtn');
            const donatePlayerBtn = $('donatePlayerBtn');

            // Wallet
            const walletSettings = $('walletSettings');
            const walletClose = $('walletClose');
            const walletInput = $('walletInput');
            const walletApply = $('walletApply');
            const walletCurrentBalance = $('walletCurrentBalance');

            // ===== STATE =====
            let balance = 1982126;
            const INITIAL_BALANCE = 1982126;
            let currentNumber = null;
            let currentCodeTimeout = null;
            let timerInterval = null;
            let selectedPlayer = null;
            let suggestTimer = null;
            let lastSuggestQuery = '';
            let toastTimeout = null;
            let notificationTimeout = null;

            // Cache para sugestões (reduz chamadas repetidas)
            const suggestionCache = new Map();

            window._currentModalType = null;
            window._selectedPlayer = null;

            const MY_WORKER_URL = 'https://even-lark-5705.luanbarbosa12278-max.deno.net/search?keyword=builderman';

            // ===== HELPERS =====
            function getCost() {
                return MODES[currentMode].cost;
            }

            function formatBalance(num) {
                if (num >= 1_000_000) return (num / 1_000_000).toFixed(2).replace(/\.00$/, '') + 'M';
                if (num >= 1_000) return (num / 1_000).toFixed(1).replace(/\.0$/, '') + 'K';
                return num.toString();
            }

            function updateUI() {
                const cost = getCost();
                balanceDisplay.textContent = formatBalance(balance);
                btnGenerate.disabled = balance < cost;
                if (walletSettings.classList.contains('visible')) {
                    walletCurrentBalance.textContent = formatBalance(balance);
                }
            }

            function loadBalance() {
                try {
                    const saved = localStorage.getItem('headless_balance_v1');
                    balance = saved ? parseInt(saved, 10) || INITIAL_BALANCE : INITIAL_BALANCE;
                } catch (e) { balance = INITIAL_BALANCE; }
                updateUI();
            }

            function saveBalance() {
                try { localStorage.setItem('headless_balance_v1', balance.toString()); } catch (e) {}
            }

            function generateNumber() {
                let result = '';
                for (let i = 0; i < 12; i++) result += Math.floor(Math.random() * 10);
                return result;
            }

            function updateDisplay(number) {
                numberText.textContent = number;
                numberText.classList.remove('placeholder');
                numberDisplay.classList.add('highlight');
                setTimeout(() => numberDisplay.classList.remove('highlight'), 500);
            }

            function setCodeStatus(text, className) {
                currentCodeStatus.textContent = text;
                currentCodeStatus.className = 'current-code-status show ' + className;
            }

            // ===== TOAST =====
            function showToast(message, type = '') {
                if (toastTimeout) clearTimeout(toastTimeout);
                const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
                toast.querySelector('.toast-icon').textContent = icon;
                toastMessage.textContent = message;
                toast.className = 'toast ' + type + ' show';
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            // ===== TOP NOTIFICATION =====
            function showTopNotification(text, duration = 2500, showSpinner = false) {
                notificationText.textContent = text;
                notificationSpinner.style.display = showSpinner ? 'inline-block' : 'none';
                topNotification.classList.add('show');
                clearTimeout(notificationTimeout);
                notificationTimeout = setTimeout(() => {
                    topNotification.classList.remove('show');
                }, duration);
            }

            // ===== TIMER =====
            function startTimer(duration) {
                timerBar.classList.add('show');
                timerFill.style.width = '100%';
                const startTime = Date.now();
                const endTime = startTime + duration;

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    const now = Date.now();
                    const remaining = Math.max(0, endTime - now);
                    const percent = (remaining / duration) * 100;
                    timerFill.style.width = percent + '%';
                    if (percent <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                        timerBar.classList.remove('show');
                    }
                }, 100);
            }

            function clearTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                timerBar.classList.remove('show');
            }

            // ===== MODAL =====
            function setModalForPurchase() {
                window._currentModalType = 'purchase';
                const mode = MODES[currentMode];
                const cost = getCost();
                modalTitle.textContent = `Comprar Item e Código (${mode.name})`;
                modalBody.innerHTML = `
                    <div class="modal-item-preview">
                        <img src="${mode.image}" alt="${mode.name}">
                    </div>
                    <div class="modal-item-details">
                        <div class="modal-item-name">Código ${mode.name}</div>
                        <div class="modal-item-sub">
                            <img src="https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/optimized/5X/0/0/9/c/009c44663703f7e852ede68d21a89460d90ab4c3_2_468x500.png" alt="moeda" style="width:16px;height:16px;vertical-align:middle;"> ${cost.toLocaleString('pt-BR')}
                        </div>
                    </div>
                `;
                modalBalanceInfo.textContent = `Seu saldo após esta transação será de ${formatBalance(balance - cost)}`;
                btnModalCancel.textContent = 'Cancelar';
                btnModalConfirm.textContent = 'Comprar Agora';
                btnModalCancel.onclick = closeModal;
                btnModalConfirm.onclick = confirmPurchase;
                modalClose.onclick = closeModal;
                modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };
                modalOverlay.classList.add('active');
            }

            function setModalForGift(player) {
                window._currentModalType = 'gift';
                window._selectedPlayer = player;
                const mode = MODES[currentMode];
                const cost = getCost();
                modalTitle.textContent = `${mode.name} [GIFT]`;
                modalBody.innerHTML = `
                    <div class="modal-item-preview" style="background: var(--roblox-dark);">
                        <img src="${mode.image}" alt="${mode.name}" style="width:60px;height:60px;object-fit:contain;">
                    </div>
                    <div class="modal-item-details">
                        <div class="modal-item-name">Presentear ${mode.name} para ${player.displayName || player.name}</div>
                        <div class="modal-item-sub">(@${player.name})</div>
                    </div>
                `;
                modalBalanceInfo.textContent = `Seu saldo após esta transação será de ${formatBalance(balance - cost)}`;
                btnModalCancel.textContent = 'Cancelar';
                btnModalConfirm.textContent = 'Confirmar Presente';
                btnModalCancel.onclick = closeModal;
                btnModalConfirm.onclick = confirmGift;
                modalClose.onclick = closeModal;
                modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };
                modalOverlay.classList.add('active');
            }

            function setModalForDonation(player) {
                window._currentModalType = 'donate';
                window._selectedPlayer = player;
                modalTitle.textContent = 'Comprar Item [GIFT]';
                modalBody.innerHTML = `
                    <div class="modal-item-preview" style="background: var(--roblox-dark);">
                        <img src="https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/original/4X/e/d/f/edfae9388da4cd8496b885a8a2df613372500d9c.png" alt="Robux" style="width:60px;height:60px;object-fit:contain;">
                    </div>
                    <div class="modal-item-details">
                        <div class="modal-item-name">Doar Robux para ${player.displayName || player.name}</div>
                        <div class="modal-item-sub">(@${player.name})</div>
                    </div>
                    <div class="value-options">
                        <div class="value-option" data-value="1000">1.000</div>
                        <div class="value-option" data-value="5000">5.000</div>
                        <div class="value-option" data-value="20000">20.000</div>
                        <div class="value-option" data-value="100000">100.000</div>
                    </div>
                    <div class="modal-input-group">
                        <label>Custom amount:</label>
                        <input type="number" id="donationAmount" value="100" min="1" step="1">
                    </div>
                `;
                modalBalanceInfo.textContent = `Seu saldo atual: ${formatBalance(balance)}`;
                btnModalCancel.textContent = 'Cancelar';
                btnModalConfirm.textContent = 'Doar Agora';
                btnModalCancel.onclick = closeModal;
                btnModalConfirm.onclick = confirmDonation;
                modalClose.onclick = closeModal;
                modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };
                modalOverlay.classList.add('active');

                const valueOptions = document.querySelectorAll('.value-option');
                const donationInput = document.getElementById('donationAmount');
                valueOptions.forEach(btn => {
                    btn.addEventListener('click', function() {
                        valueOptions.forEach(b => b.classList.remove('selected'));
                        this.classList.add('selected');
                        donationInput.value = this.dataset.value;
                    });
                });
                donationInput.addEventListener('input', function() {
                    valueOptions.forEach(b => b.classList.remove('selected'));
                });
            }

            function openModal() {
                const cost = getCost();
                if (balance < cost) {
                    showToast('❌ Saldo insuficiente!', 'error');
                    return;
                }
                setModalForPurchase();
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                window._currentModalType = null;
                window._selectedPlayer = null;
            }

            // ===== CONFIRM ACTIONS =====
            function confirmPurchase() {
                const cost = getCost();
                if (balance < cost) return;
                balance -= cost;
                saveBalance();
                updateUI();

                if (currentCodeTimeout) clearTimeout(currentCodeTimeout);
                clearTimer();
                currentNumber = generateNumber();
                updateDisplay(currentNumber);
                btnCopy.disabled = false;

                setCodeStatus('Disponível para Resgate', 'available');
                const delay = Math.floor(Math.random() * (45000 - 15000 + 1) + 15000);
                startTimer(delay);
                currentCodeTimeout = setTimeout(() => {
                    setCodeStatus('Resgatado', 'redeemed');
                    clearTimer();
                }, delay);

                if (navigator.vibrate) navigator.vibrate(10);
                closeModal();
                showTopNotification('Validando transação...', 1500, true);
                setTimeout(() => {
                    showTopNotification('Compra concluída', 2500, false);
                }, 1500);
            }

            function confirmGift() {
                const cost = getCost();
                if (balance < cost) {
                    showToast('❌ Saldo insuficiente!', 'error');
                    return;
                }
                balance -= cost;
                saveBalance();
                updateUI();
                closeModal();
                showTopNotification('Validando transação...', 1500, true);
                setTimeout(() => {
                    showTopNotification('Compra concluída', 2500, false);
                }, 1500);
                clearGiftFields();
            }

            function confirmDonation() {
                const amountInput = document.getElementById('donationAmount');
                const amount = parseInt(amountInput.value, 10);
                if (isNaN(amount) || amount <= 0) {
                    showToast('❌ Valor inválido', 'error');
                    return;
                }
                if (balance < amount) {
                    showToast('❌ Saldo insuficiente!', 'error');
                    return;
                }
                balance -= amount;
                saveBalance();
                updateUI();
                closeModal();
                showTopNotification('Validando transação...', 1500, true);
                setTimeout(() => {
                    showTopNotification(`Doação de ${amount.toLocaleString('pt-BR')} Robux enviada!`, 2500, false);
                }, 1500);
                clearGiftFields();
            }

            // ===== GIFT SEARCH (OTIMIZADO) =====
            function clearGiftFields() {
                giftInput.value = '';
                giftPlayerCard.classList.remove('show');
                giftStatus.classList.remove('show');
                giftSuggestions.classList.remove('show');
                selectedPlayer = null;
                window._selectedPlayer = null;
            }

            async function fetchWithTimeout(url, ms) {
                const res = await Promise.race([
                    fetch(url),
                    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
                ]);
                if (!res.ok) throw new Error('bad status');
                return res.json();
            }

            async function fetchWithRetry(url, ms, attempts) {
                for (let i = 0; i < attempts; i++) {
                    try { return await fetchWithTimeout(url, ms); }
                    catch { if (i === attempts - 1) throw new Error('failed'); await new Promise(r => setTimeout(r, 800)); }
                }
            }

            function showSuggestions(users) {
                giftSuggestions.innerHTML = '';
                if (!users || users.length === 0) {
                    giftSuggestions.classList.remove('show');
                    return;
                }
                users.slice(0, 4).forEach(u => {
                    const item = document.createElement('div');
                    item.className = 'suggestion-item';
                    item.innerHTML = `
                        <span>${u.name}</span>
                        <span class="badge">${u.id}</span>
                    `;
                    item.setAttribute('role', 'option');
                    item.addEventListener('click', () => {
                        giftInput.value = u.name;
                        giftSuggestions.classList.remove('show');
                        searchPlayer();
                    });
                    giftSuggestions.appendChild(item);
                });
                giftSuggestions.classList.add('show');
            }

            // Cache de resultados para evitar chamadas repetidas
            async function getSuggestions(query) {
                // Verifica cache primeiro
                if (suggestionCache.has(query)) {
                    const cached = suggestionCache.get(query);
                    if (Date.now() - cached.timestamp < 60000) { // cache por 1 minuto
                        return cached.data;
                    }
                }

                try {
                    const base = MY_WORKER_URL.replace(/\/$/, '');
                    const data = await fetchWithTimeout(`${base}/suggest?keyword=${encodeURIComponent(query)}`, 6000);
                    const result = data.data || [];
                    suggestionCache.set(query, { data: result, timestamp: Date.now() });
                    return result;
                } catch {
                    return null;
                }
            }

            async function searchPlayer() {
                const name = giftInput.value.trim();
                if (!name) {
                    giftStatus.classList.remove('show');
                    return;
                }

                giftSuggestions.classList.remove('show');
                giftPlayerCard.classList.remove('show');
                giftStatus.classList.add('show');
                giftStatus.classList.remove('err');
                giftStatus.innerHTML = '🔍 Procurando<span class="loader-dots"></span>';
                selectedPlayer = null;

                try {
                    const base = MY_WORKER_URL.replace(/\/$/, '');
                    const searchData = await fetchWithRetry(`${base}/search?keyword=${encodeURIComponent(name)}`, 6000, 2);
                    if (!searchData.data || searchData.data.length === 0) {
                        giftStatus.innerHTML = '❌ Nenhum usuário encontrado.';
                        giftStatus.classList.add('err');
                        return;
                    }
                    const user = searchData.data.find(u => u.name.toLowerCase() === name.toLowerCase()) || searchData.data[0];
                    const thumbData = await fetchWithRetry(`${base}/avatar?userId=${user.id}`, 5000, 2);
                    const imageUrl = (thumbData.data && thumbData.data[0]) ? thumbData.data[0].imageUrl : '';
                    giftAvatarImg.src = imageUrl || 'https://www.roblox.com/avatar-default.png';
                    giftDisplayName.textContent = user.displayName || user.name;
                    giftUsername.textContent = '@' + user.name;
                    giftPlayerCard.classList.add('show');
                    giftStatus.classList.remove('show');
                    selectedPlayer = user;
                    window._selectedPlayer = user;
                } catch {
                    giftStatus.innerHTML = '❌ Erro ao buscar. Tente novamente.';
                    giftStatus.classList.add('err');
                }
            }

            // ===== WALLET =====
            function toggleWallet() {
                const isVisible = walletSettings.classList.contains('visible');
                if (isVisible) {
                    walletSettings.classList.remove('visible');
                } else {
                    walletCurrentBalance.textContent = formatBalance(balance);
                    walletInput.value = balance;
                    walletSettings.classList.add('visible');
                    walletInput.focus();
                    walletInput.select();
                }
            }

            function applyWallet() {
                const val = parseInt(walletInput.value, 10);
                if (isNaN(val) || val < 0) {
                    showToast('❌ Valor inválido', 'error');
                    return;
                }
                balance = val;
                saveBalance();
                updateUI();
                walletCurrentBalance.textContent = formatBalance(balance);
                showToast('✅ Saldo atualizado!', 'success');
                walletSettings.classList.remove('visible');
            }

            // ===== MODE TOGGLE =====
            function updateMode() {
                const mode = MODES[currentMode];
                mainImage.src = mode.image;
                mainImage.alt = mode.name;
                mainTitle.textContent = mode.title;
                pageTitle.textContent = mode.title;
                currentModeLabel.textContent = mode.name;
                const nextMode = currentMode === 'headless' ? 'korblox' : 'headless';
                toggleBtn.textContent = `Alternar para ${MODES[nextMode].name}`;

                const cost = getCost();
                costValue.innerHTML = `${cost.toLocaleString('pt-BR')} <img src="https://devforum-uploads.s3.dualstack.us-east-2.amazonaws.com/uploads/optimized/5X/0/0/9/c/009c44663703f7e852ede68d21a89460d90ab4c3_2_468x500.png" alt="moeda" class="cost-icon" crossorigin="anonymous">`;
                btnGenerate.title = `Comprar código (custa ${cost.toLocaleString('pt-BR')})`;

                if (modalOverlay.classList.contains('active')) {
                    if (window._currentModalType === 'purchase') setModalForPurchase();
                    else if (window._currentModalType === 'gift' && window._selectedPlayer) setModalForGift(window._selectedPlayer);
                    else if (window._currentModalType === 'donate' && window._selectedPlayer) setModalForDonation(window._selectedPlayer);
                }
                updateUI();
            }

            function toggleMode() {
                currentMode = currentMode === 'headless' ? 'korblox' : 'headless';
                updateMode();
            }

            // ===== COPY =====
            async function copyToClipboard(text) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast('✅ Código copiado!', 'success');
                    btnCopy.classList.add('copied');
                    btnCopy.innerHTML = `
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg> Copiado!`;
                    setTimeout(() => {
                        btnCopy.classList.remove('copied');
                        btnCopy.innerHTML = `
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg> Copiar`;
                    }, 2000);
                } catch (err) {}
            }

            // ===== EVENT LISTENERS =====
            toggleBtn.addEventListener('click', toggleMode);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'F2') {
                    e.preventDefault();
                    toggleWallet();
                }
                if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
                    closeModal();
                }
            });

            walletClose.addEventListener('click', () => walletSettings.classList.remove('visible'));
            walletApply.addEventListener('click', applyWallet);
            walletInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault();
                    applyWallet(); } });

            document.addEventListener('click', (e) => {
                if (walletSettings.classList.contains('visible') && !walletSettings.contains(e.target)) {
                    walletSettings.classList.remove('visible');
                }
            });

            // ===== GIFT INPUT - OTIMIZADO =====
            giftInput.addEventListener('input', () => {
                const q = giftInput.value.trim();
                clearTimeout(suggestTimer);

                if (q.length === 0) {
                    giftSuggestions.classList.remove('show');
                    giftStatus.classList.remove('show');
                    return;
                }

                giftStatus.classList.add('show');
                giftStatus.classList.remove('err');
                giftStatus.innerHTML = '⏳ Digitando<span class="loader-dots"></span>';

                suggestTimer = setTimeout(async () => {
                    const currentQuery = giftInput.value.trim();
                    if (currentQuery !== q) return;
                    if (currentQuery.length < 2) {
                        giftSuggestions.classList.remove('show');
                        giftStatus.innerHTML = 'Digite pelo menos 2 caracteres';
                        return;
                    }

                    lastSuggestQuery = currentQuery;
                    giftStatus.innerHTML = '🔍 Buscando<span class="loader-dots"></span>';

                    try {
                        const results = await getSuggestions(currentQuery);
                        if (lastSuggestQuery === currentQuery) {
                            if (results && results.length > 0) {
                                showSuggestions(results);
                                giftStatus.classList.remove('show');
                            } else {
                                giftSuggestions.classList.remove('show');
                                giftStatus.innerHTML = 'Nenhuma sugestão encontrada';
                                giftStatus.classList.remove('err');
                            }
                        }
                    } catch {
                        if (lastSuggestQuery === currentQuery) {
                            giftSuggestions.classList.remove('show');
                            giftStatus.innerHTML = '❌ Erro ao buscar sugestões';
                            giftStatus.classList.add('err');
                        }
                    }
                }, 200);
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('#giftSearchBox')) {
                    giftSuggestions.classList.remove('show');
                }
            });

            giftInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    giftSuggestions.classList.remove('show');
                    if (giftInput.value.trim().length >= 2) {
                        searchPlayer();
                    }
                }
            });

            confirmPlayerBtn.addEventListener('click', () => {
                if (!selectedPlayer) {
                    showToast('❌ Selecione um jogador primeiro', 'error');
                    return;
                }
                setModalForGift(selectedPlayer);
            });

            donatePlayerBtn.addEventListener('click', () => {
                if (!selectedPlayer) {
                    showToast('❌ Selecione um jogador primeiro', 'error');
                    return;
                }
                setModalForDonation(selectedPlayer);
            });

            btnGenerate.addEventListener('click', openModal);
            btnCopy.addEventListener('click', () => { if (currentNumber) copyToClipboard(currentNumber); });

            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Enter') {
                    const tag = document.activeElement?.tagName?.toLowerCase();
                    if (tag !== 'input' && tag !== 'textarea' && tag !== 'select' && tag !== 'button') {
                        e.preventDefault();
                        if (modalOverlay.classList.contains('active')) {
                            if (btnModalConfirm.textContent === 'Comprar Agora') confirmPurchase();
                            else if (btnModalConfirm.textContent === 'Confirmar Presente') confirmGift();
                            else if (btnModalConfirm.textContent === 'Doar Agora') confirmDonation();
                        } else openModal();
                    }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
                    if (currentNumber && document.activeElement === document.body) {
                        e.preventDefault();
                        copyToClipboard(currentNumber);
                    }
                }
            });

            // ===== INIT =====
            loadBalance();
            if (currentNumber) btnCopy.disabled = false;
            updateMode();
        })();
    </script>
</body>
</html>
